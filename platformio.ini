; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
	zinggjm/GxEPD2@^1.6.5
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	paulstoffregen/Encoder@^1.4.4
	arduinogetstarted/ezButton@^1.0.6
monitor_speed = 115200
build_flags = 
	-I include
	; U8g2 keeps fonts in RAM here, which leaves the ESP8266 almost no heap.
	; Put them in flash and read them with pgm_read_byte_near.
	-D "U8X8_FONT_SECTION(name)=__attribute__((section(\".irom.text.\" name)))"
	-D u8x8_pgm_read(adr)=pgm_read_byte_near(adr)
